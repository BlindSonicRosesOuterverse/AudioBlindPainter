name: Build AudioBlindPainter Setup
on: [push]

jobs:
  build-installer:
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate Desktop Icon
        run: python create_icon.py

      - name: Compile Application with PyInstaller
        run: pyinstaller --noconsole --onedir --icon=icon.ico app.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Setup Installer with Inno Setup
        run: iscc setup.iss

      - name: Upload Installer Executable
        uses: actions/upload-artifact@v4
        with:
          name: AudioBlindPainter_Setup
          path: dist/AudioBlindPainter_Setup.exe
